<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0B2545">
    {% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}

    {% seo %}
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly summary">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/main.css">

    {% if page.structured_data %}{{ page.structured_data }}{% endif %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include nav.html %}

    <main id="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <script>
        const nav = document.getElementById('site-nav');
        const toggle = nav.querySelector('.nav-toggle');

        toggle.addEventListener('click', () => {
            const open = nav.classList.toggle('open');
            toggle.setAttribute('aria-expanded', open);
        });

        nav.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                nav.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
            });
        });

        const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 8);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.service-card, .hosting-point, .step, .stat, .about-content').forEach((el, i) => {
                el.classList.add('reveal');
                el.style.transitionDelay = `${(i % 3) * 80}ms`;
                observer.observe(el);
            });
        }
    </script>
</body>
</html>
